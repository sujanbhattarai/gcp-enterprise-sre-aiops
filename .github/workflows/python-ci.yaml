
name: Python CI and DevSecOps

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r automation/python/requirements.txt
          python -m pip install pytest bandit pip-audit

      - name: Run automated tests
        env:
          PYTHONPATH: automation/python
        run: python -m pytest tests/ -v

      - name: Bandit security scanning
        run: bandit -r automation/python/ -ll

      - name: Python dependency scanning
        run: pip-audit

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Gitleaks secret scanning
        run: gitleaks git --redact=100 --verbose --log-opts="--all" .

      - name: Trivy security scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

